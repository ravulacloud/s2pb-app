name: Hop-Deploy

on:

  #######################################################
  # AUTO DEPLOY ON MAIN BRANCH
  #######################################################

  push:

    branches:
      - main

    paths:
      - 'hop-orchestration/**'

  #######################################################
  # MANUAL DEPLOYMENT
  #######################################################

  workflow_dispatch:

    inputs:

      environment:
        description: "Select environment"

        required: true

        default: dev

        type: choice

        options:
          - dev
          - staging
          - prod

#######################################################
# GITHUB ACTIONS PERMISSIONS
#######################################################

permissions:

  id-token: write

  contents: read

#######################################################
# JOBS
#######################################################

jobs:

  hop-deploy:

    name: Apache Hop ECS Deployment

    runs-on: ubuntu-latest

    timeout-minutes: 60

    #######################################################
    # ENVIRONMENT VARIABLES
    #######################################################

    env:

      #######################################################
      # AWS
      #######################################################

      AWS_REGION: ap-south-1

      AWS_ACCOUNT_ID: 986401823783

      #######################################################
      # APPLICATION
      #######################################################

      APP_NAME: s2pb-app

      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

      #######################################################
      # ECR
      #######################################################

      ECR_REPOSITORY: glorytechsystems-platform-images

      IMAGE_TAG: s2pb-app-${{ github.event.inputs.environment || 'dev' }}

      IMAGE_URI: 986401823783.dkr.ecr.ap-south-1.amazonaws.com/glorytechsystems-platform-images:s2pb-app-${{ github.event.inputs.environment || 'dev' }}

      #######################################################
      # ECS
      #######################################################

      ECS_CLUSTER_NAME: s2pb-app-ecs-${{ github.event.inputs.environment || 'dev' }}

      ECS_SERVICE_NAME: s2pb-app-hop-service-${{ github.event.inputs.environment || 'dev' }}

    #######################################################
    # STEPS
    #######################################################

    steps:

      #######################################################
      # CHECKOUT SOURCE CODE
      #######################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      #######################################################
      # CONFIGURE AWS CREDENTIALS
      #######################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::986401823783:role/s2pb-githubaction-role

          aws-region: ${{ env.AWS_REGION }}

      #######################################################
      # LOGIN TO AMAZON ECR
      #######################################################

      - name: Login to Amazon ECR

        uses: aws-actions/amazon-ecr-login@v2

      #######################################################
      # VERIFY ECR REPOSITORY
      #######################################################

      - name: Verify ECR Repository

        run: |

          echo "Checking ECR repository..."

          aws ecr describe-repositories \
            --repository-names ${ECR_REPOSITORY} \
            --region ${AWS_REGION}

      #######################################################
      # BUILD DOCKER IMAGE
      #######################################################

      - name: Build Docker Image

        run: |

          echo "======================================="
          echo "Building Docker Image"
          echo "======================================="

          docker build \
            -t ${APP_NAME}:${IMAGE_TAG} \
            -f hop-orchestration/docker/Dockerfile \
            ./hop-orchestration

      #######################################################
      # TAG DOCKER IMAGE
      #######################################################

      - name: Tag Docker Image

        run: |

          echo "======================================="
          echo "Tagging Docker Image"
          echo "======================================="

          docker tag \
            ${APP_NAME}:${IMAGE_TAG} \
            ${IMAGE_URI}

      #######################################################
      # PUSH IMAGE TO ECR
      #######################################################

      - name: Push Docker Image

        run: |

          echo "======================================="
          echo "Pushing Docker Image"
          echo "======================================="

          docker push ${IMAGE_URI}

      #######################################################
      # VERIFY IMAGE EXISTS IN ECR
      #######################################################

      - name: Verify Image in ECR

        run: |

          echo "======================================="
          echo "Verifying Image in ECR"
          echo "======================================="

          aws ecr describe-images \
            --repository-name ${ECR_REPOSITORY} \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${AWS_REGION}

      #######################################################
      # FORCE ECS DEPLOYMENT
      #######################################################

      - name: Restart ECS Service

        run: |

          echo "======================================="
          echo "Restarting ECS Service"
          echo "======================================="

          aws ecs update-service \
            --cluster ${ECS_CLUSTER_NAME} \
            --service ${ECS_SERVICE_NAME} \
            --force-new-deployment \
            --region ${AWS_REGION}

      #######################################################
      # VERIFY ECS DEPLOYMENT
      #######################################################

      - name: Verify ECS Deployment

        run: |

          echo "======================================="
          echo "Verifying ECS Deployment"
          echo "======================================="

          aws ecs describe-services \
            --cluster ${ECS_CLUSTER_NAME} \
            --services ${ECS_SERVICE_NAME} \
            --region ${AWS_REGION}

      #######################################################
      # SUCCESS MESSAGE
      #######################################################

      - name: Deployment Successful

        run: |

          echo ""
          echo "======================================="
          echo "Apache Hop Deployment Successful"
          echo "======================================="
          echo ""

          echo "Environment:"
          echo "${ENVIRONMENT}"
          echo ""

          echo "Docker Image:"
          echo "${IMAGE_URI}"
          echo ""

          echo "ECS Cluster:"
          echo "${ECS_CLUSTER_NAME}"
          echo ""

          echo "ECS Service:"
          echo "${ECS_SERVICE_NAME}"
          echo ""

          echo "Deployment completed successfully"
          echo "======================================="